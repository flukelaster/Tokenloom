/* ---------- helpers (all pure functions of their arguments) ---------- */
function rr(g,x,y,w,h,r,fill,stroke,lw=2){if(w<=0||h<=0)return;g.beginPath();g.roundRect(x,y,w,h,Math.max(0,Math.min(r,w/2,h/2)));

function thr(g,pts,p,col,k=1){for(const[lw,al]of[[16*k,.09],[7*k,.22],[3*k,1]])drawOn(g,pts,p,col,lw,al)}
function bez(a,b,c,d,n=48){const o=[];for(let i=0;i<=n;i++){const t=i/n,m=1-t;o.push([m*m*m*a[0]+3*m*m*t*b[0]+3*m*t*t*c[0]+t*t*t*d[0],m*m*m*a[1]+3*m*m*t*b[1]+3*m*t*t*c[1]+t*t*t*d[1]])}return o}

  for(let i=1;i<pts.length;i++)if(L[i]>=e){const f=(e-L[i-1])/(L[i]-L[i-1]||1);return[lp(pts[i-1][0],pts[i][0],f),lp(pts[i-1][1],pts[i][1],f)]}return pts[pts.length-1]}
/* weave: warp (vertical) + weft (horizontal) threads with over/under crossings */
function weave(g,o){const{x0,y0,w,h,nx,ny}=o,dx=w/nx,dy=h/ny;
  for(let i=0;i<nx;i++){const p=o.pw(i);if(p<=0)continue;const x=x0+(i+.5)*dx;g.fillStyle=rgb(o.warpCol(i));g.fillRect(x-dx*.32,y0,dx*.64,h*p);g.fillStyle=rgb(C.ink,.35);g.fillRect(x-dx*.32,y0,3,h*p)}

    for(let i=j%2;i<nx;i+=2){const x=x0+(i+.5)*dx,pw=o.pw(i);if(pw<=0||y>y0+h*pw||x<xs||x>xs+len)continue;g.fillStyle=rgb(o.warpCol(i));g.fillRect(x-dx*.32,y-dy*.4,dx*.64,dy*.8);g.fillStyle=rgb(C.ink,.35);g.fillRect(x-dx*.32,y-dy*.4,3,dy*.8)}}}
/* Figma redline: measurement line with end ticks + label pill */
