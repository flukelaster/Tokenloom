  <rect width="1200" height="430" rx="20" fill="url(#glowBlue)" />
  <rect width="1200" height="430" rx="20" fill="url(#glowPurple)" />
  <rect x="0.75" y="0.75" width="1198.5" height="428.5" rx="19.25" stroke="#262D40" stroke-width="1.5" />

