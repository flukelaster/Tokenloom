    </radialGradient>
    <radialGradient id="glowPurple" cx="0.78" cy="0.7" r="0.48">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="0" y2="1">
