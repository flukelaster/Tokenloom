    <text x="16" y="49" fill="#A78BFA" font-family="Inter, sans-serif" font-size="11">Native Auto Layout ComponentSet</text>
    <!-- Mini Matrix Illustration -->
    <rect x="16" y="62" width="196" height="62" rx="8" fill="#FFFFFF" />
    <line x1="114" y1="62" x2="114" y2="124" stroke="#8A38F5" stroke-opacity="0.45" stroke-dasharray="3 3" />
    <line x1="16" y1="93" x2="212" y2="93" stroke="#8A38F5" stroke-opacity="0.45" stroke-dasharray="3 3" />
    <rect x="35" y="71" width="60" height="15" rx="4" fill="#2563EB" />
    <rect x="133" y="71" width="60" height="15" rx="4" fill="#1D4ED8" />
    <rect x="35" y="101" width="60" height="15" rx="4" fill="#F1F5F9" stroke="#CBD5E1" />
    <rect x="133" y="101" width="60" height="15" rx="4" fill="#E2E8F0" stroke="#94A3B8" />
