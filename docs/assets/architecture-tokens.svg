      <stop offset="0%" stop-color="#0B0D14" />
      <stop offset="50%" stop-color="#111524" />
      <stop offset="100%" stop-color="#0D0F18" />
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.22" cy="0.25" r="0.45">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18" />
