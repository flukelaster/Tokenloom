  <text x="236" y="45" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">Deterministic Alias Resolution &amp; Mode-Agnostic Component Inheritance</text>

